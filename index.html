<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Character encoding and responsive viewport help the app work across browsers and screens. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple daily task manager built with HTML, Bootstrap, CSS, and JavaScript.">

    <title>To-Do App | Plan, Track and Manage your tasks</title>

    <!-- Bootstrap supplies reusable layout and form classes while custom CSS remains in style.css. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="app-header">
        <div class="container">
            <h1 class="header-title mb-2">My Tasks</h1>
        </div>
    </header>

    <main class="container app-container">
        <section class="task-panel" aria-labelledby="task-panel-heading">
            <div class="panel-heading">
                <div>
                    <h2 id="task-panel-heading" class="h4 mb-2">What do you want accomplished today</h2>
                </div>

                <!-- This live region announces changes to screen-reader users. -->
                <p id="taskCounter" class="task-counter mb-2" role="status" aria-live="polite">0 tasks</p>
            </div>

            <!-- The form lets users submit with the button or the Enter key. -->
            <form id="taskForm" class="task-form" autocomplete="off">
                <label for="taskInput" class="visually-hidden">New task</label>
                <input id="taskInput" class="form-control task-input" type="text" placeholder="Describe your task here..."
                    aria-describedby="taskMessage">
                <button id="addTaskButton" class="btn add-task-button" type="submit">
                    <span aria-hidden="true">+</span>
                    <span>Add task</span>
                </button>
            </form>

            <!-- Validation feedback is populated by JavaScript and announced through aria-live. -->
            <p id="taskMessage" class="task-message" role="alert" aria-live="assertive"></p>

            <!-- JavaScript creates each task item inside this list. -->
            <ul id="taskList" class="task-list list-unstyled mb-0" aria-label="Task list"></ul>

            <!-- JavaScript displays this state when the task array is empty. -->
            <div id="emptyState" class="empty-state">
                <p class="empty-state-title mb-1">No tasks yet</p>
                <p class="empty-state-copy mb-0">Add a task above to start planning your day.</p>
            </div>

            <div class="panel-footer">
                <p id="completedCounter" class="completed-counter mb-0">0 completed</p>
                <button id="clearAllButton" class="btn clear-all-button" type="button">Clear all</button>
            </div>
        </section>
    </main>

    <!-- The script is loaded at the end so every HTML element exists before JavaScript selects it. -->
    <script src="script.js"></script>
</body>

</html>
